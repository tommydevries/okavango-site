<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = "";
  try {
    const raw = Uint8Array.from(atob(document.getElementById('ct').textContent.trim()), c => c.charCodeAt(0));
    const salt = raw.slice(0,16), iv = raw.slice(16,28), data = raw.slice(28);
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById('pw').value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:300000, hash:"SHA-256"}, km,
      {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, data);
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  } catch (ex) { err.textContent = "That's not it. Ask Tom."; }
});
</script>
